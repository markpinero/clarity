name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Verify Swift toolchain
        run: |
          swift --version
          swift --version | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)'

      - name: Run tests
        run: swift test

      - name: Build release artifact
        run: ./script/build_and_run.sh --release

      - name: Verify release bundle
        run: |
          codesign --verify --deep --strict dist/release/Clarity.app
          plutil -extract CFBundleIdentifier raw dist/release/Clarity.app/Contents/Info.plist
          test "$(plutil -extract LSMinimumSystemVersion raw dist/release/Clarity.app/Contents/Info.plist)" = "13.0"
          vtool -show-build dist/release/Clarity.app/Contents/MacOS/Clarity | grep -Eq 'minos 13\.0'
          test -s dist/release/Clarity.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clarity-macos
          path: dist/release/Clarity.zip
          if-no-files-found: error
